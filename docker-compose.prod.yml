version: '3.8'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: meetnotes_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetnotes}
      POSTGRES_USER: ${POSTGRES_USER:-meetnotes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetnotes_user} -d ${POSTGRES_DB:-meetnotes}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - meetnotes_network
    restart: unless-stopped

  # Redis for caching (Production)
  redis:
    image: redis:7-alpine
    container_name: meetnotes_redis_prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - meetnotes_network
    restart: unless-stopped

  # MinIO for S3-compatible storage (Production)
  minio:
    image: minio/minio:latest
    container_name: meetnotes_minio_prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - meetnotes_network
    restart: unless-stopped

  # Backend API (Production)
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-meetnotes-india}-backend:${TAG:-latest}
    container_name: meetnotes_backend_prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-meetnotes_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-meetnotes}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${S3_BUCKET:-meetnotes-audio}
      - S3_REGION=${S3_REGION:-us-east-1}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-209715200}
      - AUDIO_RETENTION_HOURS=${AUDIO_RETENTION_HOURS:-24}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-auto}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
    volumes:
      - /tmp/whisper_cache:/root/.cache/whisper
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - meetnotes_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Frontend (Production)
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-meetnotes-india}-frontend:${TAG:-latest}
    container_name: meetnotes_frontend_prod
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - meetnotes_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx reverse proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: meetnotes_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - meetnotes_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  meetnotes_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: meetnotes_bridge