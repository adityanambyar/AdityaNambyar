version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: meetnotes_postgres
    environment:
      POSTGRES_DB: meetnotes
      POSTGRES_USER: meetnotes_user
      POSTGRES_PASSWORD: meetnotes_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetnotes_user -d meetnotes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meetnotes_network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: meetnotes_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meetnotes_network

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: meetnotes_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - meetnotes_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetnotes_backend
    environment:
      - DATABASE_URL=postgresql://meetnotes_user:meetnotes_password@postgres:5432/meetnotes
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET=meetnotes-audio
      - S3_REGION=us-east-1
      - MAX_FILE_SIZE=209715200
      - AUDIO_RETENTION_HOURS=24
      - WHISPER_MODEL=base
      - WHISPER_LANGUAGE=auto
      - SECRET_KEY=your-secret-key-here-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./backend:/app
      - /tmp/whisper_cache:/root/.cache/whisper
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - meetnotes_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetnotes_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    networks:
      - meetnotes_network

  # Nginx reverse proxy (optional, for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: meetnotes_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - meetnotes_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  meetnotes_network:
    driver: bridge

# Development override
# To use this, run: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up